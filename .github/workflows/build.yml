      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

