      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/honoraod app/src/main/res/values app/src/main/res/values-v31 app/src/main/res/anim
          cat > settings.gradle <<'AODEOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "HonorAOD"
          include ':app'
          AODEOF
          cat > build.gradle <<'AODEOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          AODEOF
          cat > gradle.properties <<'AODEOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          AODEOF
          cat > app/build.gradle <<'AODEOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.honoraod'
              compileSdk 34

              defaultConfig {
                  applicationId "com.honoraod"
                  minSdk 27
                  // targetSdk 29 keeps legacy storage access so the app can read /sdcard/AOD
                  targetSdk 29
                  versionCode 5
                  versionName "1.4"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }

              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }
          AODEOF
          cat > app/src/main/AndroidManifest.xml <<'AODEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <application
                  android:allowBackup="false"
                  android:label="Honor AOD"
                  android:requestLegacyExternalStorage="true"
                  android:theme="@style/AodTheme">

                  <activity
                      android:name=".AodActivity"
                      android:exported="true"
                      android:excludeFromRecents="true"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout"
                      android:screenOrientation="portrait"
                      android:showWhenLocked="true"
                      android:turnScreenOn="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          AODEOF
          cat > app/src/main/res/values/styles.xml <<'AODEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <!-- Every open/close animation is replaced by an empty one. -->
              <style name="AodNoAnim" parent="@android:style/Animation">
                  <item name="android:windowEnterAnimation">@anim/none</item>
                  <item name="android:windowExitAnimation">@anim/none</item>
                  <item name="android:activityOpenEnterAnimation">@anim/none</item>
                  <item name="android:activityOpenExitAnimation">@anim/none</item>
                  <item name="android:activityCloseEnterAnimation">@anim/none</item>
                  <item name="android:activityCloseExitAnimation">@anim/none</item>
                  <item name="android:taskOpenEnterAnimation">@anim/none</item>
                  <item name="android:taskOpenExitAnimation">@anim/none</item>
                  <item name="android:taskCloseEnterAnimation">@anim/none</item>
                  <item name="android:taskCloseExitAnimation">@anim/none</item>
                  <item name="android:taskToFrontEnterAnimation">@anim/none</item>
                  <item name="android:taskToFrontExitAnimation">@anim/none</item>
                  <item name="android:taskToBackEnterAnimation">@anim/none</item>
                  <item name="android:taskToBackExitAnimation">@anim/none</item>
              </style>

              <style name="AodTheme" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">@android:color/black</item>
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowAnimationStyle">@style/AodNoAnim</item>
                  <item name="android:windowDisablePreview">true</item>
                  <item name="android:statusBarColor">@android:color/black</item>
                  <item name="android:navigationBarColor">@android:color/black</item>
              </style>
          </resources>
          AODEOF
          cat > app/src/main/res/values-v31/styles.xml <<'AODEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <!-- Android 12+: plain black splash with no icon, and no open/close animations -->
              <style name="AodTheme" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">@android:color/black</item>
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowAnimationStyle">@style/AodNoAnim</item>
                  <item name="android:windowDisablePreview">true</item>
                  <item name="android:statusBarColor">@android:color/black</item>
                  <item name="android:navigationBarColor">@android:color/black</item>
                  <item name="android:windowSplashScreenBackground">@android:color/black</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@android:color/transparent</item>
                  <item name="android:windowSplashScreenAnimationDuration">0</item>
              </style>
          </resources>
          AODEOF
          cat > app/src/main/res/anim/none.xml <<'AODEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <!-- An animation that does nothing (1 ms, fully opaque, no movement). -->
          <set xmlns:android="http://schemas.android.com/apk/res/android">
              <alpha
                  android:fromAlpha="1.0"
                  android:toAlpha="1.0"
                  android:duration="1" />
          </set>
          AODEOF
          cat > app/src/main/java/com/honoraod/AodActivity.java <<'AODEOF'
          package com.honoraod;

          import android.app.Activity;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Color;
          import android.graphics.ImageDecoder;
          import android.graphics.Typeface;
          import android.graphics.drawable.AnimatedImageDrawable;
          import android.graphics.drawable.Drawable;
          import android.os.BatteryManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.DisplayMetrics;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.Window;
          import android.view.WindowManager;
          import android.widget.FrameLayout;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.TextClock;
          import android.widget.TextView;
          import android.widget.VideoView;

          import java.io.BufferedReader;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.InputStreamReader;
          import java.io.IOException;
          import java.util.HashMap;
          import java.util.Map;

          /**
           * Always-on display: dimmed image / GIF / video background with a One UI style
           * stacked clock, date, battery and optional custom text. Shown over the lockscreen.
           *
           * Battery safety:
           *  - closes itself after TIMEOUT seconds (default 10, 0 = never) with a fade-out
           *  - KEEP_SCREEN_ON is removed as soon as it closes, so the system can turn the screen off
           *  - always finishes when it is no longer visible (screen off), so it never lingers
           *
           * Settings are read from /sdcard/AOD/config.conf.
           */
          public class AodActivity extends Activity {

              private final Handler handler = new Handler(Looper.getMainLooper());
              private final Map<String, String> cfg = new HashMap<>();

              private FrameLayout root;
              private LinearLayout clockBox;
              private TextView batteryTv;
              private int driftStep = 0;
              private boolean closing = false;
              private int fadeMs = 700;

              private final Runnable drift = new Runnable() {
                  @Override
                  public void run() {
                      if (clockBox != null) {
                          float px = getResources().getDisplayMetrics().density * 3f;
                          int[] dx = {-2, 0, 2, 0, -1, 1};
                          int[] dy = {0, 2, 0, -2, 1, -1};
                          clockBox.setTranslationX(dx[driftStep % dx.length] * px);
                          clockBox.setTranslationY(dy[driftStep % dy.length] * px);
                          driftStep++;
                      }
                      handler.postDelayed(this, 60000);
                  }
              };

              /** Timeout reached: fade to black, then tell the module so it can turn the screen off. */
              private final Runnable timeoutClose = new Runnable() {
                  @Override
                  public void run() {
                      fadeToBlackAndWaitForScreenOff();
                  }
              };

              /** Safety net: if the screen never turned off, close anyway (should not normally happen). */
              private final Runnable failsafeFinish = new Runnable() {
                  @Override
                  public void run() {
                      finishAndRemoveTask();
                      overridePendingTransition(0, 0);
                  }
              };

              private final BroadcastReceiver batteryReceiver = new BroadcastReceiver() {
                  @Override
                  public void onReceive(Context context, Intent intent) {
                      updateBattery(intent);
                  }
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  overridePendingTransition(0, 0); // no system open animation: only our own fade
                  readConfig();
                  writeFlag("closed_timeout", false); // clear stale flag from an earlier run

                  setShowWhenLocked(true);
                  setTurnScreenOn(true);

                  Window w = getWindow();
                  w.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON
                          | WindowManager.LayoutParams.FLAG_FULLSCREEN
                          | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS);
                  WindowManager.LayoutParams lp = w.getAttributes();
                  float br = geti("BRIGHTNESS", 8) / 255f;
                  lp.screenBrightness = Math.max(0.01f, Math.min(1f, br));
                  if (Build.VERSION.SDK_INT >= 28) {
                      lp.layoutInDisplayCutoutMode =
                              WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                  }
                  w.setAttributes(lp);
                  hideBars();

                  fadeMs = "0".equals(get("FADE", "1")) ? 0 : clampi(geti("FADE_MS", 700), 100, 3000);

                  root = new FrameLayout(this);
                  root.setBackgroundColor(Color.BLACK);

                  loadMedia(get("MEDIA", ""));

                  // dim overlay on top of the media
                  float dim = Math.max(0f, Math.min(1f, getf("DIM", 0.55f)));
                  View overlay = new View(this);
                  overlay.setBackgroundColor(Color.BLACK);
                  overlay.setAlpha(1f - dim);
                  root.addView(overlay, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));

                  if (!"0".equals(get("SHOW_CLOCK", "1"))) {
                      buildClock();
                  }

                  root.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          // tap = user wants the lockscreen: close right away (no timeout flag)
                          closeNow();
                      }
                  });
                  setContentView(root);

                  // fade in
                  if (fadeMs > 0) {
                      root.setAlpha(0f);
                      root.animate().alpha(1f).setDuration(fadeMs).start();
                  }

                  Intent sticky = registerReceiver(batteryReceiver,
                          new IntentFilter(Intent.ACTION_BATTERY_CHANGED));
                  if (sticky != null) updateBattery(sticky);
                  handler.postDelayed(drift, 60000);

                  // auto close (battery saver). TIMEOUT=0 means "never".
                  int timeout = geti("TIMEOUT", 10);
                  if (timeout > 0) {
                      handler.postDelayed(timeoutClose, timeout * 1000L);
                  }
              }

              // ---------- closing ----------

              private void releaseScreen() {
                  // let the system turn the screen off again
                  getWindow().clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              }

              private void closeNow() {
                  if (closing) return;
                  closing = true;
                  handler.removeCallbacksAndMessages(null);
                  releaseScreen();
                  finishAndRemoveTask();
                  overridePendingTransition(0, 0);
              }

              /**
               * Closing at timeout. The activity is NOT finished here: finishing would show the home screen
               * for a moment before the screen turns off. Instead the screen fades to plain black, the
               * module is told (closed_timeout flag), it turns the screen off, and only then does this
               * activity go away (onStop). The window itself is opaque black, so nothing shows through.
               */
              private void fadeToBlackAndWaitForScreenOff() {
                  if (closing) return;
                  closing = true;
                  handler.removeCallbacks(drift);
                  releaseScreen();
                  final Runnable ready = new Runnable() {
                      @Override
                      public void run() {
                          writeFlag("closed_timeout", true);
                          handler.postDelayed(failsafeFinish, 8000);
                      }
                  };
                  if (fadeMs > 0 && root != null) {
                      root.animate().alpha(0f).setDuration(fadeMs).withEndAction(ready).start();
                  } else {
                      if (root != null) root.setAlpha(0f);
                      ready.run();
                  }
              }

              // ---------- config ----------

              private void readConfig() {
                  File f = new File(Environment.getExternalStorageDirectory(), "AOD/config.conf");
                  if (!f.exists()) return;
                  try (BufferedReader br = new BufferedReader(
                          new InputStreamReader(new FileInputStream(f), "UTF-8"))) {
                      String line;
                      while ((line = br.readLine()) != null) {
                          line = line.trim();
                          if (line.isEmpty() || line.startsWith("#")) continue;
                          int i = line.indexOf('=');
                          if (i <= 0) continue;
                          cfg.put(line.substring(0, i).trim(), line.substring(i + 1).trim());
                      }
                  } catch (IOException ignored) {
                  }
              }

              private String get(String k, String d) {
                  String v = cfg.get(k);
                  return (v == null || v.isEmpty()) ? d : v;
              }

              private int geti(String k, int d) {
                  try {
                      return Integer.parseInt(get(k, String.valueOf(d)));
                  } catch (NumberFormatException e) {
                      return d;
                  }
              }

              private float getf(String k, float d) {
                  try {
                      return Float.parseFloat(get(k, String.valueOf(d)));
                  } catch (NumberFormatException e) {
                      return d;
                  }
              }

              private static int clampi(int v, int lo, int hi) {
                  return Math.max(lo, Math.min(hi, v));
              }

              // ---------- media ----------

              private void loadMedia(String name) {
                  if (name == null || name.isEmpty()) return;
                  File f = new File(Environment.getExternalStorageDirectory(), "AOD/" + name);
                  if (!f.exists()) return;
                  String l = name.toLowerCase();
                  final DisplayMetrics dm = getResources().getDisplayMetrics();

                  try {
                      if (l.endsWith(".mp4") || l.endsWith(".webm") || l.endsWith(".mkv")
                              || l.endsWith(".m4v") || l.endsWith(".3gp")) {
                          VideoView vv = new VideoView(this);
                          vv.setVideoPath(f.getAbsolutePath());
                          vv.setOnPreparedListener(new android.media.MediaPlayer.OnPreparedListener() {
                              @Override
                              public void onPrepared(android.media.MediaPlayer mp) {
                                  mp.setLooping(true);
                                  mp.setVolume(0f, 0f);
                              }
                          });
                          vv.setOnErrorListener(new android.media.MediaPlayer.OnErrorListener() {
                              @Override
                              public boolean onError(android.media.MediaPlayer mp, int what, int extra) {
                                  return true;
                              }
                          });
                          FrameLayout.LayoutParams vlp = new FrameLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.MATCH_PARENT, Gravity.CENTER);
                          root.addView(vv, vlp);
                          vv.start();
                          return;
                      }

                      ImageView iv = new ImageView(this);
                      iv.setScaleType(ImageView.ScaleType.CENTER_CROP);
                      if (Build.VERSION.SDK_INT >= 28) {
                          final int screenW = dm.widthPixels;
                          ImageDecoder.Source src = ImageDecoder.createSource(f);
                          Drawable d = ImageDecoder.decodeDrawable(src,
                                  new ImageDecoder.OnHeaderDecodedListener() {
                                      @Override
                                      public void onHeaderDecoded(ImageDecoder decoder,
                                                                  ImageDecoder.ImageInfo info,
                                                                  ImageDecoder.Source source) {
                                          int s = Math.max(1, info.getSize().getWidth() / screenW);
                                          decoder.setTargetSampleSize(s);
                                      }
                                  });
                          iv.setImageDrawable(d);
                          if (d instanceof AnimatedImageDrawable) {
                              AnimatedImageDrawable a = (AnimatedImageDrawable) d;
                              a.setRepeatCount(AnimatedImageDrawable.REPEAT_INFINITE);
                              a.start();
                          }
                      } else {
                          BitmapFactory.Options o = new BitmapFactory.Options();
                          o.inSampleSize = 2;
                          Bitmap bmp = BitmapFactory.decodeFile(f.getAbsolutePath(), o);
                          if (bmp != null) iv.setImageBitmap(bmp);
                      }
                      root.addView(iv, new FrameLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  } catch (Throwable t) {
                      // bad file / out of memory: just show the clock on black
                  }
              }

              // ---------- clock ----------

              private void buildClock() {
                  DisplayMetrics dm = getResources().getDisplayMetrics();
                  // sizes are percentages: 100 = default
                  float clockScale = clampi(geti("CLOCK_SIZE", 100), 40, 180) / 100f;
                  float textScale = clampi(geti("TEXT_SIZE", 100), 50, 250) / 100f;

                  float big = dm.widthPixels * 0.30f * clockScale;
                  boolean h24 = !"0".equals(get("H24", "1"));
                  boolean showDate = !"0".equals(get("SHOWDATE", "1"));
                  String custom = get("CUSTOM_TEXT", "");
                  Typeface light = Typeface.create("sans-serif-light", Typeface.NORMAL);

                  clockBox = new LinearLayout(this);
                  clockBox.setOrientation(LinearLayout.VERTICAL);
                  clockBox.setGravity(Gravity.CENTER_HORIZONTAL);

                  if (showDate) {
                      TextClock date = new TextClock(this);
                      date.setFormat12Hour("EEE, MMM d");
                      date.setFormat24Hour("EEE, MMM d");
                      styleText(date, dm.widthPixels * 0.05f * textScale,
                              Typeface.create("sans-serif-medium", Typeface.NORMAL));
                      clockBox.addView(date, wrap(0));
                  }

                  TextClock hour = new TextClock(this);
                  String hf = h24 ? "HH" : "h";
                  hour.setFormat12Hour(hf);
                  hour.setFormat24Hour(hf);
                  styleText(hour, big, light);
                  clockBox.addView(hour, wrap((int) (dm.density * 6)));

                  TextClock min = new TextClock(this);
                  min.setFormat12Hour("mm");
                  min.setFormat24Hour("mm");
                  styleText(min, big, light);
                  clockBox.addView(min, wrap(-(int) (big * 0.14f)));

                  batteryTv = new TextView(this);
                  styleText(batteryTv, dm.widthPixels * 0.045f * textScale,
                          Typeface.create("sans-serif", Typeface.NORMAL));
                  clockBox.addView(batteryTv, wrap((int) (dm.density * 18)));

                  if (!custom.isEmpty()) {
                      TextView ct = new TextView(this);
                      styleText(ct, dm.widthPixels * 0.05f * textScale,
                              Typeface.create("sans-serif", Typeface.NORMAL));
                      ct.setText(custom);
                      int pad = (int) (dm.density * 24);
                      ct.setPadding(pad, 0, pad, 0);
                      LinearLayout.LayoutParams cp = new LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                      cp.topMargin = (int) (dm.density * 14);
                      clockBox.addView(ct, cp);
                  }

                  root.addView(clockBox, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT, Gravity.CENTER));
              }

              private LinearLayout.LayoutParams wrap(int topMargin) {
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  p.topMargin = topMargin;
                  p.gravity = Gravity.CENTER_HORIZONTAL;
                  return p;
              }

              private void styleText(TextView tv, float sizePx, Typeface face) {
                  tv.setTextColor(Color.WHITE);
                  tv.setTextSize(TypedValue.COMPLEX_UNIT_PX, sizePx);
                  tv.setTypeface(face);
                  tv.setIncludeFontPadding(false);
                  tv.setGravity(Gravity.CENTER);
                  tv.setShadowLayer(12f, 0f, 0f, Color.BLACK);
              }

              private void updateBattery(Intent i) {
                  if (batteryTv == null || i == null) return;
                  int level = i.getIntExtra(BatteryManager.EXTRA_LEVEL, -1);
                  int scale = i.getIntExtra(BatteryManager.EXTRA_SCALE, 100);
                  int status = i.getIntExtra(BatteryManager.EXTRA_STATUS, -1);
                  boolean charging = status == BatteryManager.BATTERY_STATUS_CHARGING
                          || status == BatteryManager.BATTERY_STATUS_FULL;
                  if (level < 0 || scale <= 0) return;
                  int pct = Math.round(level * 100f / scale);
                  batteryTv.setText(pct + "%" + (charging ? "  ⚡" : ""));
              }

              // ---------- window / lifecycle ----------

              private void hideBars() {
                  getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                                  | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                                  | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                                  | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                                  | View.SYSTEM_UI_FLAG_FULLSCREEN
                                  | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideBars();
              }

              /** Small flag files the module reads. They live in the app's own storage folder. */
              private File flagFile(String name) {
                  File d = getExternalFilesDir(null);
                  return d == null ? null : new File(d, name);
              }

              private void writeFlag(String name, boolean present) {
                  File m = flagFile(name);
                  if (m == null) return;
                  try {
                      if (present) {
                          m.getParentFile().mkdirs();
                          m.createNewFile();
                      } else if (m.exists()) {
                          m.delete();
                      }
                  } catch (IOException ignored) {
                  }
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  writeFlag("active", true);
              }

              @Override
              protected void onPause() {
                  writeFlag("active", false);
                  super.onPause();
              }

              /** Not visible any more (screen off / user left): never linger in the background. */
              @Override
              protected void onStop() {
                  closing = true;
                  handler.removeCallbacksAndMessages(null);
                  if (!isFinishing()) {
                      finishAndRemoveTask();
                  }
                  super.onStop();
              }

              @Override
              protected void onDestroy() {
                  handler.removeCallbacksAndMessages(null);
                  writeFlag("active", false);
                  try {
                      unregisterReceiver(batteryReceiver);
                  } catch (Exception ignored) {
                  }
                  super.onDestroy();
              }
          }
          AODEOF

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HonorAOD-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Honor AOD app (build ${{ github.run_number }})
          files: app/build/outputs/apk/debug/app-debug.apk

