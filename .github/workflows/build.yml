      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/honoraod app/src/main/res/values app/src/main/res/values-v31
          cat > settings.gradle <<'AODEOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "HonorAOD"
          include ':app'
          AODEOF
          cat > build.gradle <<'AODEOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          AODEOF
          cat > gradle.properties <<'AODEOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          AODEOF
          cat > app/build.gradle <<'AODEOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.honoraod'
              compileSdk 34

              defaultConfig {
                  applicationId "com.honoraod"
                  minSdk 27
                  // targetSdk 29 keeps legacy storage access so the app can read /sdcard/AOD
                  targetSdk 29
                  versionCode 3
                  versionName "1.2"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }

              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }
          AODEOF
          cat > app/src/main/AndroidManifest.xml <<'AODEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <application
                  android:allowBackup="false"
                  android:label="Honor AOD"
                  android:requestLegacyExternalStorage="true"
                  android:theme="@style/AodTheme">

                  <activity
                      android:name=".AodActivity"
                      android:exported="true"
                      android:excludeFromRecents="true"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout"
                      android:screenOrientation="portrait"
                      android:showWhenLocked="true"
                      android:turnScreenOn="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          AODEOF
          cat > app/src/main/res/values/styles.xml <<'AODEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AodTheme" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">@android:color/black</item>
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowAnimationStyle">@null</item>
                  <item name="android:windowDisablePreview">true</item>
                  <item name="android:statusBarColor">@android:color/black</item>
                  <item name="android:navigationBarColor">@android:color/black</item>
              </style>
          </resources>
          AODEOF
          cat > app/src/main/res/values-v31/styles.xml <<'AODEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <!-- Android 12+: the system splash screen is plain black with no icon, so nothing shows before the AOD -->
              <style name="AodTheme" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">@android:color/black</item>
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowAnimationStyle">@null</item>
                  <item name="android:windowDisablePreview">true</item>
                  <item name="android:statusBarColor">@android:color/black</item>
                  <item name="android:navigationBarColor">@android:color/black</item>
                  <item name="android:windowSplashScreenBackground">@android:color/black</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@android:color/transparent</item>
                  <item name="android:windowSplashScreenAnimationDuration">0</item>
              </style>
          </resources>
          AODEOF
          cat > app/src/main/java/com/honoraod/AodActivity.java <<'AODEOF'
          package com.honoraod;

          import android.app.Activity;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Color;
          import android.graphics.ImageDecoder;
          import android.graphics.Typeface;
          import android.graphics.drawable.AnimatedImageDrawable;
          import android.graphics.drawable.Drawable;
          import android.os.BatteryManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.DisplayMetrics;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.Window;
          import android.view.WindowManager;
          import android.widget.FrameLayout;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.TextClock;
          import android.widget.TextView;
          import android.widget.VideoView;

          import java.io.BufferedReader;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.InputStreamReader;
          import java.io.IOException;
          import java.util.HashMap;
          import java.util.Map;

          /**
           * Always-on display: dimmed image / GIF / video background with a One UI style
           * stacked clock, date, battery and optional custom text. Shown over the lockscreen.
           *
           * Battery safety:
           *  - closes itself after TIMEOUT seconds (default 10, 0 = never) with a fade-out
           *  - KEEP_SCREEN_ON is removed as soon as it closes, so the system can turn the screen off
           *  - always finishes when it is no longer visible (screen off), so it never lingers
           *
           * Settings are read from /sdcard/AOD/config.conf.
           */
          public class AodActivity extends Activity {

              private final Handler handler = new Handler(Looper.getMainLooper());
              private final Map<String, String> cfg = new HashMap<>();

              private FrameLayout root;
              private LinearLayout clockBox;
              private TextView batteryTv;
              private int driftStep = 0;
              private boolean closing = false;
              private int fadeMs = 700;

              private final Runnable drift = new Runnable() {
                  @Override
                  public void run() {
                      if (clockBox != null) {
                          float px = getResources().getDisplayMetrics().density * 3f;
                          int[] dx = {-2, 0, 2, 0, -1, 1};
                          int[] dy = {0, 2, 0, -2, 1, -1};
                          clockBox.setTranslationX(dx[driftStep % dx.length] * px);
                          clockBox.setTranslationY(dy[driftStep % dy.length] * px);
                          driftStep++;
                      }
                      handler.postDelayed(this, 60000);
                  }
              };

              /** Timeout reached: tell the module "this was a timeout", then fade out and close. */
              private final Runnable timeoutClose = new Runnable() {
                  @Override
                  public void run() {
                      writeFlag("closed_timeout", true);
                      closeWithFade();
                  }
              };

              private final BroadcastReceiver batteryReceiver = new BroadcastReceiver() {
                  @Override
                  public void onReceive(Context context, Intent intent) {
                      updateBattery(intent);
                  }
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  overridePendingTransition(0, 0); // no system open animation: only our own fade
                  readConfig();
                  writeFlag("closed_timeout", false); // clear stale flag from an earlier run

                  setShowWhenLocked(true);
                  setTurnScreenOn(true);

                  Window w = getWindow();
                  w.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON
                          | WindowManager.LayoutParams.FLAG_FULLSCREEN
                          | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS);
                  WindowManager.LayoutParams lp = w.getAttributes();
                  float br = geti("BRIGHTNESS", 8) / 255f;
                  lp.screenBrightness = Math.max(0.01f, Math.min(1f, br));
                  if (Build.VERSION.SDK_INT >= 28) {
                      lp.layoutInDisplayCutoutMode =
                              WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                  }
                  w.setAttributes(lp);
                  hideBars();

                  fadeMs = "0".equals(get("FADE", "1")) ? 0 : clampi(geti("FADE_MS", 700), 100, 3000);

                  root = new FrameLayout(this);
                  root.setBackgroundColor(Color.BLACK);

                  loadMedia(get("MEDIA", ""));

                  // dim overlay on top of the media
                  float dim = Math.max(0f, Math.min(1f, getf("DIM", 0.55f)));
                  View overlay = new View(this);
                  overlay.setBackgroundColor(Color.BLACK);
                  overlay.setAlpha(1f - dim);
                  root.addView(overlay, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));

                  if (!"0".equals(get("SHOW_CLOCK", "1"))) {
                      buildClock();
                  }

                  root.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          // tap = user wants the lockscreen: close right away (no timeout flag)
                          closeNow();
                      }
                  });
                  setContentView(root);

                  // fade in
                  if (fadeMs > 0) {
                      root.setAlpha(0f);
                      root.animate().alpha(1f).setDuration(fadeMs).start();
                  }

                  Intent sticky = registerReceiver(batteryReceiver,
                          new IntentFilter(Intent.ACTION_BATTERY_CHANGED));
                  if (sticky != null) updateBattery(sticky);
                  handler.postDelayed(drift, 60000);

                  // auto close (battery saver). TIMEOUT=0 means "never".
                  int timeout = geti("TIMEOUT", 10);
                  if (timeout > 0) {
                      handler.postDelayed(timeoutClose, timeout * 1000L);
                  }
              }

              // ---------- closing ----------

              private void releaseScreen() {
                  // let the system turn the screen off again
                  getWindow().clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              }

              private void closeNow() {
                  if (closing) return;
                  closing = true;
                  handler.removeCallbacksAndMessages(null);
                  releaseScreen();
                  finishAndRemoveTask();
                  overridePendingTransition(0, 0);
              }

              private void closeWithFade() {
                  if (closing) return;
                  closing = true;
                  handler.removeCallbacks(drift);
                  releaseScreen();
                  if (fadeMs > 0 && root != null) {
                      root.animate().alpha(0f).setDuration(fadeMs).withEndAction(new Runnable() {
                          @Override
                          public void run() {
                              finishAndRemoveTask();
                              overridePendingTransition(0, 0);
                          }
                      }).start();
                  } else {
                      finishAndRemoveTask();
                      overridePendingTransition(0, 0);
                  }
              }

              // ---------- config ----------

              private void readConfig() {
                  File f = new File(Environment.getExternalStorageDirectory(), "AOD/config.conf");
                  if (!f.exists()) return;
                  try (BufferedReader br = new BufferedReader(
                          new InputStreamReader(new FileInputStream(f), "UTF-8"))) {
                      String line;
                      while ((line = br.readLine()) != null) {
                          line = line.trim();
                          if (line.isEmpty() || line.startsWith("#")) continue;
                          int i = line.indexOf('=');
                          if (i <= 0) continue;
                          cfg.put(line.substring(0, i).trim(), line.substring(i + 1).trim());
                      }
                  } catch (IOException ignored) {
                  }
              }

              private String get(String k, String d) {
                  String v = cfg.get(k);
                  return (v == null || v.isEmpty()) ? d : v;
              }

              private int geti(String k, int d) {
                  try {
                      return Integer.parseInt(get(k, String.valueOf(d)));
                  } catch (NumberFormatException e) {
                      return d;
                  }
              }

              priv
